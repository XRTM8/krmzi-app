name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Synchronize Web Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release-output/krmzi-pro.apk
          ls -lh release-output/

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Krmzi Mobile Pro - ${{ github.event.inputs.version || github.ref_name }}
          body: |
            # 📱 تطبيق قرمزي برو | Krmzi Mobile Pro (APK)
            
            الإصدار الرسمي لتطبيق مشاهدة وبث المسلسلات التركية بدون أي إعلانات نهائياً وبجودة تصل إلى 1080p Full HD.
            
            ---
            
            ### ✨ مميزات التطبيق في هذا الإصدار:
            - **صفر إعلانات (100% Ad-Free):** حظر كامل لكافة النوافذ المنبثقة والإعلانات الإجبارية وإعلانات السيرفرات.
            - **جودة Full HD (1080p):** استخراج دفقات الفيديو الأصلية المباشرة وتشغيلها في مشغل أصلي فائق السلاسة.
            - **إيماءات تحكم ذكية للهاتف:**
              - السحب الرأسي على يسار الشاشة للتحكم بالسطوع.
              - السحب الرأسي على يمين الشاشة للتحكم بمستوى الصوت.
              - الضغط المطول المستمر على الشاشة لمضاعفة السرعة فوراً إلى **`2X`**.
              - النقر المزدوج على أطراف الشاشة للتقديم والتأخير (+10s / -10s).
              - زر تخطي شارة البداية بنقرة واحدة (+85 ثانية).
              - الانتقال التلقائي للحلقة التالية مع عداد تنازلي ذكي.
            - **واجهة مينيمال سينمائية (OLED Dark):** مصممة خصيصاً لتجربة هاتف فاخرة بفيزياء 60FPS.
            - **سجل المشاهدة والمفضلة:** استئناف تشغيل الحلقات تلقائياً من حيث توقفت.
            
            ---
            
            ### 📥 طريقة التثبيت على الهاتف:
            1. قم بتحميل ملف **`krmzi-pro.apk`** أدناه.
            2. افتح الملف على هاتفك الأندرويد واضغط **تثبيت (Install)**.
            3. استمتع بمشاهدة جميع المسلسلات التركية المفضلة بأعلى جودة وبدون أي إعلان.
          files: release-output/krmzi-pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
